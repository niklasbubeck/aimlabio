# Tests for the automation that turns issues into profile pull requests.
# Fast and hermetic - no Hugo, no network, no GitHub API.
name: Script tests

on:
  push:
    paths: ['.github/scripts/**', '.github/workflows/scripts.yml', '.github/workflows/member-request.yml', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths: ['.github/scripts/**', '.github/ISSUE_TEMPLATE/**', '.github/workflows/member-request.yml', 'content/home/people.md', 'CONTRIBUTING.md']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Unit tests
        run: python3 .github/scripts/test_issue_to_author.py
      - name: Issue forms match the script and the People widget
        run: python3 .github/scripts/check_forms.py
